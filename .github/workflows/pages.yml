name: landing page

# A promoted release can already have its archives. A fresh release usually
# needs the second trigger, after the release workflow finishes uploading them.
on:
  push:
    branches: [ master ]
    paths:
      - 'site/**'
      - 'ruxguitar.gif'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
  release:
    types: [released]
  workflow_run:
    workflows: [release binaries]
    types: [completed]

# Two runs pushing the same branch would race, and the second is the one
# worth keeping.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    name: Publish to gh-pages
    runs-on: ubuntu-latest
    # The default token is read-only; pushing the branch needs write.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Assemble the site
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/latest" > "$RUNNER_TEMP/release.json"
          if site/build.sh "$RUNNER_TEMP/release.json"; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            status=$?
            if [[ $status == 75 && $GITHUB_EVENT_NAME == release ]]; then
              echo "Waiting for the release workflow to finish uploading the archives."
            else
              exit "$status"
            fi
          fi
      # Plain git rather than a third-party publish action: this pushes to
      # our own repository with the token the runner already has, in five
      # commands. gh-pages is a build artifact, not a history, so each run
      # replaces it outright. The token arrives as an environment variable
      # rather than pasted into the script text, so it is never part of the
      # command this step is built from.
      - name: Push the branch
        if: steps.build.outputs.ready == 'true'
        working-directory: _site
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          git init -q -b gh-pages
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -q -m "Site built from $(git -C .. rev-parse HEAD)"
          git push -q --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" gh-pages
